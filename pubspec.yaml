name: tailorx
description: TailorX - Smart Tailoring Management App

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  image_picker: ^1.1.2

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/dress_icons/gents/
    - assets/dress_icons/ladies/
    - assets/dress_icons/kids/
    - assets/icons/

  fonts: []